<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
      .accent { fill:#eef2ff; stroke:#c7d2fe; stroke-width:1.5; }
      .title { fill:#0f172a; font-size:16px; font-weight:600; }
      .sub { fill:#64748b; font-size:12.5px; }
      .line { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="220" fill="#ffffff"/>

  <rect class="box" x="30" y="70" width="160" height="86" rx="12"/>
  <text class="title" x="110" y="106" text-anchor="middle">git push main</text>
  <text class="sub" x="110" y="130" text-anchor="middle">提交代码与版本标签</text>

  <line class="line" x1="190" y1="113" x2="224" y2="113"/>

  <rect class="box" x="226" y="70" width="160" height="86" rx="12"/>
  <text class="title" x="306" y="106" text-anchor="middle">GitHub Actions</text>
  <text class="sub" x="306" y="130" text-anchor="middle">构建前后端镜像</text>

  <line class="line" x1="386" y1="113" x2="420" y2="113"/>

  <rect class="box" x="422" y="70" width="160" height="86" rx="12"/>
  <text class="title" x="502" y="106" text-anchor="middle">GHCR</text>
  <text class="sub" x="502" y="130" text-anchor="middle">latest + 版本标签</text>

  <line class="line" x1="582" y1="113" x2="616" y2="113"/>

  <rect class="accent" x="618" y="70" width="160" height="86" rx="12"/>
  <text class="title" x="698" y="106" text-anchor="middle">服务器</text>
  <text class="sub" x="698" y="130" text-anchor="middle">compose pull</text>

  <line class="line" x1="778" y1="113" x2="812" y2="113"/>

  <rect class="accent" x="814" y="70" width="156" height="86" rx="12"/>
  <text class="title" x="892" y="106" text-anchor="middle">重新创建容器</text>
  <text class="sub" x="892" y="130" text-anchor="middle">数据卷原地保留</text>
</svg>
