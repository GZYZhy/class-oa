<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
      .group { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; stroke-dasharray:6 5; }
      .title { fill:#0f172a; font-size:17px; font-weight:600; }
      .sub { fill:#64748b; font-size:13px; }
      .label { fill:#475569; font-size:13px; }
      .accent { fill:#eef2ff; stroke:#c7d2fe; stroke-width:1.5; }
      .accent-title { fill:#4338ca; font-size:17px; font-weight:600; }
      .line { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="540" fill="#ffffff"/>

  <!-- 客户端 -->
  <rect class="box" x="40" y="200" width="180" height="120" rx="14"/>
  <text class="title" x="130" y="245" text-anchor="middle">浏览器 / 手机</text>
  <text class="sub" x="130" y="272" text-anchor="middle">桌面端 · 手机端 · PWA</text>
  <text class="sub" x="130" y="294" text-anchor="middle">HTTPS</text>

  <line class="line" x1="220" y1="260" x2="278" y2="260"/>
  <text class="label" x="249" y="246" text-anchor="middle">HTTPS</text>

  <!-- Docker 宿主机 -->
  <rect class="group" x="280" y="70" width="470" height="410" rx="20"/>
  <text class="sub" x="296" y="98">Docker 宿主机</text>

  <rect class="accent" x="310" y="130" width="180" height="120" rx="12"/>
  <text class="accent-title" x="400" y="170" text-anchor="middle">前端 nginx</text>
  <text class="sub" x="400" y="196" text-anchor="middle">静态资源 · 品牌注入</text>
  <text class="sub" x="400" y="218" text-anchor="middle">/api 反向代理</text>

  <line class="line" x1="490" y1="190" x2="548" y2="190"/>
  <text class="label" x="519" y="176" text-anchor="middle">/api</text>

  <rect class="accent" x="550" y="130" width="170" height="120" rx="12"/>
  <text class="accent-title" x="635" y="170" text-anchor="middle">后端 FastAPI</text>
  <text class="sub" x="635" y="196" text-anchor="middle">业务规则 · 权限</text>
  <text class="sub" x="635" y="218" text-anchor="middle">SQLAlchemy</text>

  <rect class="box" x="310" y="320" width="410" height="110" rx="12"/>
  <text class="title" x="515" y="355" text-anchor="middle">数据卷 data/backend</text>
  <text class="sub" x="515" y="382" text-anchor="middle">SQLite（或 MySQL）· 照片 · 资料 · 公告附件</text>
  <text class="sub" x="515" y="404" text-anchor="middle">会话密钥 · VAPID 私钥 · 请假与证明文件</text>

  <line class="line" x1="635" y1="250" x2="635" y2="318"/>
  <text class="label" x="658" y="288">读写</text>

  <!-- 外部服务 -->
  <rect class="box" x="800" y="90" width="160" height="96" rx="12"/>
  <text class="title" x="880" y="126" text-anchor="middle">邮件 SMTP</text>
  <text class="sub" x="880" y="152" text-anchor="middle">通知 · 验证码</text>

  <rect class="box" x="800" y="216" width="160" height="96" rx="12"/>
  <text class="title" x="880" y="252" text-anchor="middle">手机推送</text>
  <text class="sub" x="880" y="278" text-anchor="middle">Bark · Web Push</text>

  <rect class="box" x="800" y="342" width="160" height="96" rx="12"/>
  <text class="title" x="880" y="378" text-anchor="middle">Webhook</text>
  <text class="sub" x="880" y="404" text-anchor="middle">自定义自动化</text>

  <line class="line" x1="720" y1="170" x2="796" y2="142"/>
  <line class="line" x1="720" y1="200" x2="796" y2="250"/>
  <line class="line" x1="720" y1="230" x2="796" y2="370"/>
  <text class="label" x="758" y="118" text-anchor="middle">通知</text>
</svg>
