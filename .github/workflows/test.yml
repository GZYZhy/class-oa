name: 全量测试

# 前后端两套回归测试都在这里跑：
#   backend/tests    pytest 为每个用例起一次真后端进程 + 一个全新临时库，很慢
#   frontend/tests   npm test，用 Vite 的 SSR 管道真渲染 SFC
#
# 测试口径只有这一处，CI 和本地 ./runTest.sh 跑的是同一批文件。
# 发版构建不再等测试（见 build-images.yml）：这里只负责普通提交的检查。
on:
  push:
    branches: [main]
    # 纯文档改动不影响测试结果，不占这十几分钟
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env.example"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

# 连续推两次时把前一次取消掉：全量测试时间长，没必要让过期的提交占着跑。
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端 pytest
    runs-on: ubuntu-latest
    # 本机全量约 8 分钟，CI 上每个用例都要起停后端进程，留足余量
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 和 backend/Dockerfile 保持同一个大版本：测试跑在生产实际使用的 Python 上
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: 全量测试
        working-directory: backend
        # conftest 为每个用例起一个真后端进程、连一个全新临时库，
        # 不读也不写仓库 data/ 里的真实数据。
        # -x：遇到第一个失败就停，不把剩下几分钟的用例跑完
        run: python -m pytest tests -q -x

  frontend:
    name: 前端渲染测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 不能用 frontend/Dockerfile 的 node:20：render.mjs 用了
          # node:module 的 registerHooks，那是 Node 22.15 才有的。
          # 构建镜像用哪个 Node 无所谓（Vite 产物与它无关），测试要能跑起来。
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 渲染测试
        working-directory: frontend
        run: npm test
