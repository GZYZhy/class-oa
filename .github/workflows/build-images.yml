name: 构建并推送镜像

# 只有推送 vX.Y.Z 版本标签时才构建镜像。日常提交只跑全量测试（test.yml），
# 不构建、也不移动 latest —— 没发版的提交不该被服务器 `docker compose pull` 拿到。
#
# 构建前会先把 test.yml 里的前后端全量测试整个跑一遍，测试不过就不出镜像。
#
# 想在本地构建（比如要带 arm64、或者 GitHub 挂了）还是用
# scripts/build_images.sh，镜像前缀和日期标签的算法两边一致
#（它不带 sha 标签，也没有下面这条「发版提交额外打语义版本号」）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 应急：在 Actions 页面手动构建一次（不带语义版本标签）

# 同一个标签重复推送（强制移动标签）时，把前一次还在跑的构建取消掉：
# 省额度，也避免两个任务同时往同一批标签上写（后完成的那个赢，结果不可预测）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # 门禁：把全量测试 workflow 原样调起来，前后端都通过才轮到 build。
    # 本地全量约 8 分钟，CI 上更久，所以发版构建会明显比以前慢 —— 这是故意的。
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout 要读仓库
      packages: write # 往 ghcr.io 推镜像
    strategy:
      # 一个失败不让另一个被取消：两个都跑完，日志一次看全
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          # 下面靠「HEAD 上有没有 vX.Y.Z 标签」决定要不要多打一个版本号标签，
          # 所以得把 tag 一起取下来（默认的浅克隆不带 tag）
          fetch-depth: 0

      - name: 计算镜像名与标签
        id: meta
        run: |
          # 镜像前缀和 scripts/build_images.sh 的 IMAGE_PREFIX 保持一致。
          # 走 step output 而不是顶层 env：env 上下文在某些位置能不能用有讲究，
          # steps 上下文则各处都保证可用。
          prefix="ghcr.io/gzyzhy/class-oa"
          service="${{ matrix.service }}"
          # 日期按**北京时间**算。本机跑 build_images.sh 得到的是本地日期（CST），
          # 这里要是用 runner 默认的 UTC，凌晨推送会打出前一天的标签，
          # 同一天用两种方式构建就会得到两个不同的版本号。
          version="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          short_sha="$(git rev-parse --short=7 HEAD)"

          # 发版那个提交上打着 v1.7.1 这样的标签时，镜像也带上 1.7.1。
          # 现在就是推标签触发的构建，checkout 下来的 HEAD 上一定有它；
          # 手动 workflow_dispatch 触发则可能没有，那就只打 latest/日期/sha。
          version_tag="$(git tag --points-at HEAD --list 'v[0-9]*' | sed 's/^v//' | head -n 1)"

          # 标签清单在这里拼好，下面 build 和「小结」两步共用一份 ——
          # 各写一遍的话，条件分支一多，日志里说的和实际推的迟早对不上
          tag_list=(
            "${prefix}-${service}:latest"
            "${prefix}-${service}:${version}"
            "${prefix}-${service}:sha-${short_sha}"
          )
          if [ -n "$version_tag" ]; then
            tag_list+=("${prefix}-${service}:${version_tag}")
          fi
          tags="$(printf '%s\n' "${tag_list[@]}")"

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "==> 本次标签："
          echo "${tags}" | sed 's/^/    /'

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN 是每个 workflow 自动带的，不用配任何 secret
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          # 服务器是 x86_64。runner 本身就是 amd64，原生构建，不走 QEMU。
          # 哪天要在 arm 机器上跑，再改成 linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 缓存放 GitHub 自己的存储里，下一次构建能复用绝大部分层。
          # scope 必须按镜像分开，否则后端和前端会互相覆盖对方的缓存
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: 小结
        # 用 env 传多行输出：直接插进 run 里的话，换行会破坏脚本结构
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
