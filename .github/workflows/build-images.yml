name: 构建并推送镜像

# 推 main 就自动构建，改完代码服务器 pull 一下就能拿到新镜像。
# 纯文档改动不触发 —— 那类提交不会改变镜像内容，没必要占构建额度。
#
# 想在本地构建（比如要带 arm64、或者 GitHub 挂了）还是用
# scripts/build_images.sh，两边的标签规则是同一套。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".env.example"
      - ".gitignore"
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

# 连续推两次时，把前一次还在跑的构建取消掉：省额度，也避免两个任务
# 同时往同一批标签上写（后完成的那个赢，结果不可预测）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout 要读仓库
      packages: write # 往 ghcr.io 推镜像
    strategy:
      # 一个失败不让另一个被取消：两个都跑完，日志一次看全
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名与标签
        id: meta
        run: |
          # 镜像前缀和 scripts/build_images.sh 的 IMAGE_PREFIX 保持一致。
          # 走 step output 而不是顶层 env：env 上下文在某些位置能不能用有讲究，
          # steps 上下文则各处都保证可用。
          prefix="ghcr.io/gzyzhy/class-oa"
          # 日期按**北京时间**算。本机跑 build_images.sh 得到的是本地日期（CST），
          # 这里要是用 runner 默认的 UTC，凌晨推送会打出前一天的标签，
          # 同一天用两种方式构建就会得到两个不同的版本号。
          version="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "==> 本次标签：latest / ${version} / sha-${short_sha}"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN 是每个 workflow 自动带的，不用配任何 secret
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          # 服务器是 x86_64。runner 本身就是 amd64，原生构建，不走 QEMU。
          # 哪天要在 arm 机器上跑，再改成 linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-${{ matrix.service }}:latest
            ${{ steps.meta.outputs.prefix }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}-${{ matrix.service }}:sha-${{ steps.meta.outputs.short_sha }}
          # 缓存放 GitHub 自己的存储里，下一次构建能复用绝大部分层。
          # scope 必须按镜像分开，否则后端和前端会互相覆盖对方的缓存
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: 小结
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.prefix }}-${{ matrix.service }}:latest"
            echo "${{ steps.meta.outputs.prefix }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}"
            echo "${{ steps.meta.outputs.prefix }}-${{ matrix.service }}:sha-${{ steps.meta.outputs.short_sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
