# 固定项目名。不设的话会跟着目录名走，换个目录克隆就变成另一个 project，
# 网络、容器前缀全跟着变，数据卷和排查都会乱。
name: class-oa

services:
  # 后端服务
  backend:
    # 镜像来自公开的 GHCR，服务器上不需要 docker login；拉新版用 docker compose pull。
    image: ghcr.io/gzyzhy/class-oa-backend:${IMAGE_TAG:-latest}
    container_name: class-oa-backend
    restart: unless-stopped
    env_file:
      # 所有环境变量统一放在项目根目录的 .env 里（通开密码、推送地址、VAPID 等）。
      # 文件不提交、不进镜像（.gitignore 已排除）；required: false 保证没这个
      # 文件时也能正常起（后端会走默认值）。
      - path: ./.env
        required: false
    ports:
      # 只绑宿主机回环地址：前端 nginx 走 Docker 网络访问 backend:8000，
      # healthcheck 也在容器内打 localhost:8000，都不经过宿主端口。
      # 对外暴露这个端口等于**绕过前端这一层**，任何人都能直连后端 ——
      # 那样 X-Forwarded-For 就是他自己写的，按 IP 的封禁会形同虚设。
      # ⚠️ 破坏性变更：原来直连 <服务器IP>:8000 的集成/防火墙规则会失效。
      #    确实需要外部访问时，请改成 "8000:8000" 并同时把
      #    TRUSTED_PROXIES 收紧到真正的代理网段。
      - "127.0.0.1:8000:8000"
    volumes:
      # 数据持久化：数据库、学生照片、资料文件、会话密钥、VAPID 私钥都在这里。
      # 统一放在项目根的 data/ 目录，备份/迁移只要打包这一个目录。
      # 更新镜像时数据目录不动，docker compose up -d 即可。
      # 注意 .dockerignore 已把 data/ 排除在构建之外，隐私数据只从这里进容器。
      - ./data/backend:/app/data
    environment:
      - TZ=Asia/Shanghai
      # 会话签名密钥：留空会自动生成并保存到 data/.session_secret（推荐留空）
      # 如需手动指定，取消下面一行的注释并改成长随机字符串
      # - SESSION_SECRET_KEY=请改成随机字符串
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    image: ghcr.io/gzyzhy/class-oa-frontend:${IMAGE_TAG:-latest}
    container_name: class-oa-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      # 开启 HTTPS 时取消下面这行注释，并把证书挂进去（见下方 volumes）
      # - "443:443"
    depends_on:
      # 等后端健康检查通过再起 nginx，否则首屏请求可能 502
      backend:
        condition: service_healthy
    volumes:
      # 自定义 nginx 配置：把 nginx.conf（或 nginx.conf.template）放进 data/frontend/
      # 后重启即可生效（entrypoint 会检测到并用它替换默认模板，envsubst 的变量替换照常用）。
      # 目录留空 = 用容器内置的默认配置，开箱即用。
      - ./data/frontend:/app/custom
    environment:
      - TZ=Asia/Shanghai
      # ---- 站点品牌（班级名 / 院系名 / 页脚署名）----
      # 前端镜像是 CI 预构建的，Vite 的构建期变量在部署侧不存在，所以品牌只能由
      # 容器启动时注入（entrypoint 用 envsubst 写进 site-config.js / index.html /
      # manifest.webmanifest）。值由 compose 从项目根 .env 插值，这里不给兜底值 ——
      # 没配就是空白，详见 .env.example 的「前端品牌」一段。
      # 刻意不用 env_file：那会把 MASTER_PASSWORD 之类的机密一起灌进 nginx 容器。
      # 改完要 `docker compose up -d frontend`，restart 不会重新注入环境变量。
      - SITE_NAME=${SITE_NAME:-}
      - SITE_SHORT_NAME=${SITE_SHORT_NAME:-}
      - SITE_SUBTITLE=${SITE_SUBTITLE:-}
      - SITE_COLLEGE=${SITE_COLLEGE:-}
      - SITE_MAJOR=${SITE_MAJOR:-}
      # 页脚署名，支持 HTML（页面上按 HTML 渲染）
      - SITE_FOOTER=${SITE_FOOTER:-}
      # SEO 描述；留空时由 entrypoint 取 SITE_NAME
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-}
      # 对外基址，用来给 index.html 里的 og:image 拼绝对地址
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # 可选的 <head> 注入内容（统计 / 跟踪器等第三方脚本）。
      # 原样插入，不转义；多行写法见 .env.example
      - HEAD_INJECT=${HEAD_INJECT:-}
      # ---- 高德地图 JS API（签到时选地点 / 学生定位）----
      # 留空 = 地图降级为手填经纬度，签到主体功能照常可用。
      # 这两个值会随 site-config.js 发给每个访客，不是机密
      - AMAP_JS_KEY=${AMAP_JS_KEY:-}
      - AMAP_SECURITY_CODE=${AMAP_SECURITY_CODE:-}
      # 监听的域名，默认 _（所有域名）
      # - NGINX_SERVER_NAME=example.com
      # 是否信任反向代理的 X-Forwarded-* 头（on/off），默认 on
      # - NGINX_TRUST_PROXY=on
      # 可信代理 IP 列表（空格分隔），默认 172.16.0.0/12（整个 Docker 网桥网段，
      #   也就是 Docker 宿主机本身 —— 最外层 nginx 跑在宿主机上时，容器看到的
      #   来源 IP 就在这个网段里；如果前面还有 CDN，再把 CDN 的网段加进来）
      # - NGINX_TRUSTED_PROXIES=172.16.0.0/12
      # 上传文件大小限制，默认 70M（意见反馈 3 个附件 × 单个 20MB 需要 ≥65M，
      #   调小的话大附件会在这里被 413 挡掉）
      # - NGINX_CLIENT_MAX_BODY_SIZE=70M
      # SSL 证书路径（容器内路径），两个都配置了才开启 HTTPS
      # - NGINX_SSL_CERT=/etc/nginx/ssl/cert.pem
      # - NGINX_SSL_KEY=/etc/nginx/ssl/key.pem
    healthcheck:
      # 必须写 127.0.0.1 而不是 localhost：容器里 localhost 同时映射到 ::1，
      # busybox wget 会先试 IPv6，而 nginx 只 listen 了 IPv4，于是永远"连接被拒"
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
