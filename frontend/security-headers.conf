# 安全响应头。**单独成文件用 include 引**，不是图省事：
# nginx 的 add_header 是「整份继承」——子 location 只要自己写了一条 add_header，
# server 级的那几条就全部失效（不是叠加）。本站 /api/ 和 = /index.html 都有自己的
# 缓存头，所以那两处必须显式 include 本文件，否则最关键的那条 CSP 恰好落不到
# SPA 首页上（首页是唯一真正需要 CSP 的「文档」）。
#
# 放这里而不是宝塔的站点 vhost：面板一保存站点设置就会按模板重写整个 vhost，
# 手工加的响应头会被冲掉（2026-10-03 实测发生了一次）。这份随前端镜像发布，面板碰不到。
#
# 自定义部署（把 data/frontend 挂成 /app/custom 并放自己的 nginx.conf）时，
# 记得同样 include 本文件，否则这一整套头会静默消失。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP 是纵深防御：它挡不住「注入的脚本以你的身份调接口」——那要靠通知正文的
# DOMPurify 消毒（见 src/views/Notices.vue）。这里只保证注入的脚本执行不起来。
# 白名单照着本站实际用到的资源定，漏一个就出事故：
#   challenges.cloudflare.com  登录页 Turnstile（脚本 + iframe + 它自己的请求）
#   *.amap.com                 签到的地图 / 逆地理编码；脚本与接口是三个不同子域，
#                              漏掉任何一个，地图都会静默降级成手填经纬度
#   style-src 'unsafe-inline'  Element Plus 与本站大量内联 style，去掉会大面积崩样式
#   img-src https:             允许通知 Markdown 里贴外链图片
#   img-src data: blob:        水印的 data:image/svg+xml 背景图
#   worker-src blob:           pdf.js 用 blob 起 worker
#   connect-src 'self'         axios 调 /api，别加宽，加了等于把数据外送的路留着
# 改完务必到登录页点一次：Turnstile 出不来 = 谁也登不进去。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://webapi.amap.com https://restapi.amap.com https://vdata.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' https:; connect-src 'self' https://challenges.cloudflare.com https://webapi.amap.com https://restapi.amap.com https://vdata.amap.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
