<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--# include virtual="/api/share-meta${request_uri}" -->
    <!--# if expr="$request_uri = /^\/share\//" -->
    <!--# else -->
    <title>${SITE_NAME}</title>
    <meta name="description" content="${SITE_DESCRIPTION}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="${SITE_NAME}" />
    <meta property="og:description" content="${SITE_DESCRIPTION}" />
    <meta property="og:url" content="${SITE_PUBLIC_URL}/" />
    <meta property="og:site_name" content="${SITE_NAME}" />
    <meta property="og:image" content="${SITE_PUBLIC_URL}/icons/share-512.jpg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="robots" content="noindex, nofollow" />
    <!--# endif -->

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="${SITE_SHORT_NAME}" />

    <script src="/site-config.js"></script>
    <script src="/share-boot.js"></script>

    <!-- Vue 挂载前先显示这一块。首屏 JS 在弱网下要好几秒，空白页会让用户
         以为打不开；这里是纯 HTML + 内联样式，随首页 HTML 一起到，不用等 JS。
         Vue mount 时会清空 #app，这段自然消失。 -->
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        background-color: #f5f6fd;
        background-image:
          radial-gradient(900px 600px at 8% -10%, rgba(129, 140, 248, 0.26), transparent 62%),
          radial-gradient(800px 600px at 100% 0%, rgba(167, 139, 250, 0.18), transparent 58%);
        color: #252a44;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        text-align: center;
      }
      .boot-mark {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6366f1, #8b7cf6);
        box-shadow: 0 10px 26px rgba(99, 102, 241, 0.28);
      }
      .boot-name {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .boot-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #7d829b;
      }
      .boot-spinner {
        width: 16px;
        height: 16px;
        box-sizing: border-box;
        border: 2px solid rgba(99, 102, 241, 0.22);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        .boot-screen {
          background-color: #0d0f1f;
          background-image:
            radial-gradient(900px 600px at 8% -10%, rgba(99, 102, 241, 0.20), transparent 62%),
            radial-gradient(800px 600px at 100% 0%, rgba(139, 92, 246, 0.14), transparent 58%);
          color: #eef0ff;
        }
        .boot-status { color: #9aa0b8; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; }
      }
    </style>

    ${HEAD_INJECT}
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 22 8 12 13 2 8 12 3Z" fill="white"/>
            <path d="M6 10.5V15c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"
              stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="boot-name">${SITE_NAME}</div>
        <div class="boot-status">
          <span class="boot-spinner" aria-hidden="true"></span>
          <span>正在加载…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
