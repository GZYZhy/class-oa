<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--# include virtual="/api/share-meta${request_uri}" -->
    <!--# if expr="$request_uri = /^\/share\//" -->
    <!--# else -->
    <title>${SITE_NAME}</title>
    <meta name="description" content="${SITE_DESCRIPTION}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="${SITE_NAME}" />
    <meta property="og:description" content="${SITE_DESCRIPTION}" />
    <meta property="og:url" content="${SITE_PUBLIC_URL}/" />
    <meta property="og:site_name" content="${SITE_NAME}" />
    <meta property="og:image" content="${SITE_PUBLIC_URL}/icons/share-512.jpg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="robots" content="noindex, nofollow" />
    <!--# endif -->

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#409EFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="${SITE_SHORT_NAME}" />

    <script src="/site-config.js"></script>
    <script src="/share-boot.js"></script>

    ${HEAD_INJECT}
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
